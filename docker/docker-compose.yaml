services:
  db_order:
    image: postgres:14.3
    ports:
      - 5432:5432
    volumes:
      - ../database/create_order.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: app
  db_account:
    image: postgres:14.3
    ports:
      - 5433:5432
    volumes:
      - ../database/create_account.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: app
  db_query:
    image: postgres:14.3
    ports:
      - 5434:5432
    volumes:
      - ../database/create_query.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: app
  queue:
    image: rabbitmq:3-management
    ports:
      - 5672:5672
      - 15672:15672